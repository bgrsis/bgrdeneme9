application:
  microservice-configuration:
    hazelcast:
      discovery-mechanism: "lite_member"
      lite-member:
        cluster-members: "conversationlogger"
        instance-port-padding: 5701
  microservice-role:
    aggregator: true
    raw-data: true
  service-time-configuration:
    service-time1-lower-bound: 0
    service-time1-upper-bound: 10
    service-time2-lower-bound: 10
    service-time2-upper-bound: 20
    service-time3-lower-bound: 20
    service-time3-upper-bound: 30
    service-time4-lower-bound: 30
    service-time4-upper-bound: 60
  task-executor-properties:
    core-size: 4
    maximum-size: 6
    queue-capacity: 1000000
cron-job:
  initialize-agent-aggregation-15-min-cron: "0 6/15 * * * ?"
  initialize-agent-session-aggregation-15-min-cron: "0 4/15 * * * ?"
  initialize-agent-sub-type-aggregation-15-min-cron: "0 8/15 * * * ?"
  initialize-queue-aggregation-15-min-cron: "0 7/15 * * * ?"
eureka:
  client:
    service-url:
      defaultZone: "{cipher}f7439e7fdeddd46f267775c9e60bed253334666a735dba96ffd9c4a6e5d7e22d62fdc47c66551e3977252ddea788c8eaf8c2593447934f99b86951b5362934b4"
jhipster:
  cors:
    allow-credentials: true
    allowed-headers: "*"
    allowed-methods: "*"
    allowed-origins: "http://localhost:26080,https://localhost:26080,http://localhost:8080,http://localhost:8050,https://localhost:8050,https://localhost:8080"
    exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
    max-age: 1800
  security:
    oauth2:
      audience:
      - "account"
      - "api://default"
      - "sistas-chatbot"
      - "sistas-eva"
      - "sistas-voice"
kafka:
  agentMessageTopic: "AGENT_MESSAGE_TOPIC"
  bootstrap-servers: "localhost:9092"
  callMessageTopic: "CALL_MESSAGE_TOPIC"
  consumer:
    auto:
      offset:
        reset: "latest"
    group:
      id: "conversation-logger"
  different-group-id-consumer:
    auto:
      offset:
        reset: "latest"
    group:
      id: "conversation-logger-${spring.application.instance-id:${random.value}}"
  fromConversationLoggerToMediaProcessorTopic: "FROM_CONVERSATION_LOGGER_TO_MEDIA_PROCESSOR_TOPIC"
  fromMediaProcessorToConversationLoggerTopic: "FROM_MEDIA_PROCESSOR_TO_CONVERSATION_LOGGER_TOPIC"
  generalMessageTopic: "GENERAL_MESSAGE_TOPIC"
  sendAckTimeoutSeconds: 10
  sendRetryDelaySeconds: 2
  sendRetrySchedulerThreads: 8
  topics:
    number-of-partitions: 1
    replication-factor: 1
logging:
  level:
    ROOT: "DEBUG"
    com:
      sistas:
        cc:
          conversation:
            logger: "DEBUG"
    org:
      hibernate:
        SQL: "DEBUG"
    tech:
      jhipster: "DEBUG"
not-ready-reason:
  default-provider: "sisphone"
server:
  port: 26083
spring:
  cloud:
    stream:
      kafka:
        binder:
          brokers: "localhost:9092"
  datasource:
    hikari:
      maximum-pool-size: 500
      minimum-idle: 50
    password: "{cipher}5ddbfc005e55f41885f44f636587438ea81d24b90e79a14e4d93db2ebf980a69"
    url: "jdbc:sqlserver://localhost:1433;database=Test04-SisVoiceCC;encrypt=true;trustServerCertificate=true"
    username: "{cipher}8a8f4993aa0738f098c2aa6e42be4c388bc084d2fed43be1669715ac3dc7aedf"
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: "http://localhost:9080"
        registration:
          oidc:
            client-id: "sistas-voice"
            client-secret: "{cipher}2c3e841aabcbdd482adb3c5c51ad1872f28309ce00bad0a5d4f4d0a8d35a5ed8026885e56215474a47a0769dff4cde98d1f4245787c6446204e7ea41eec15a6b"
user-data-config:
  cron: "0 0 * * * ?"
  instance-name: "USER_DATA"
  profile: "prod"
