jhipster:
  cors:
    allow-credentials: true
    allowed-headers: "*"
    allowed-methods: "*"
    allowed-origins: "http://localhost:8100,http://localhost:9000,http://localhost:26080,https://localhost:26080,https://localhost:8050,http://localhost:8050"
    exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
    max-age: 1800
